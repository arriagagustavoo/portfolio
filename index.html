    <!-- must stay above every stylesheet: a script after one waits for it, and the theme would paint late -->
    <script>
      (function(){
        var saved = null;
        try {
          saved = localStorage.getItem('theme');
        } catch (e) {
          saved = null;
        }
        if (!saved) {
          saved = 'dark';
        }
        document.documentElement.setAttribute('data-theme', saved);
      })();
    </script>
